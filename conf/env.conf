# env.conf file - DO NOT EDIT!
# This is the default environment needed for the wrapper to work 

# HTTP port ramalama serves the OpenAI-compatible API on.
export MODEL_PORT="8080"
# Host port mapped to pi-agent's RPC port.
export PI_RPC_PORT="50051"

# Max seconds to wait for ramalama's /v1/models before treating startup as failed.
export RAMALAMA_HEALTHCHECK_TIMEOUT=60

# Model(s) auto-started by --start-rpc / --start-rpc-async (non-interactive
# RPC bootstrap for VSCode). One model, or a comma-separated list — every
# entry must already be pulled locally (unpulled entries are skipped with
# a warning, not a hard failure). If unset, or if none of its entries are
# pulled, the router starts with every locally available model instead, so
# a specific one can still be picked and loaded later at runtime (e.g.
# from the VSCode extension) rather than blocking startup on a selection.
export DEFAULT_RPC_MODEL=""

# Router-mode 'ramalama serve' --models-max: how many of the configured
# models may be loaded (resident) at once. Defaults to the number of
# models actually being served this session if left empty — 0 means
# unlimited, which is what an unset/empty selection resolves to anyway.
export RAMALAMA_MODELS_MAX="1"

# EXPERIMENTAL, leave empty until told otherwise. Gates per-model
# MODEL_PARAMS tuning in router mode, which needs a ramalama build with
# containers/ramalama#2889 merged (router-mode --engine-args is silently
# dropped in ramalama <= 0.24.0 without it — confirmed via --dryrun).
# When empty, the router starts with plain auto-discovery instead of
# failing on a missing preset file. See user.env.conf.example for the
# exact form this needs once that fix is in a released ramalama version.
export RAMALAMA_ENGINE_ARGS=""

# Directory containing the 'ramalama' binary, only needed if the process
# invoking pi-ramalama doesn't inherit your shell's PATH (e.g. VSCode spawning
# the pi wrapper). Leave empty to rely on PATH as usual.
export RAMALAMA_BIN_DIR=""

source "$(dirname "${BASH_SOURCE[0]}")/user.env.conf"

# Host directory mounted to /workspace in pi-agent. Override in
# user.env.conf; falls back to ~/.pi/workspaces if unset.
export PI_RAMALAMA_WD="${PI_RAMALAMA_WD:-$HOME/.pi/workspace}"
